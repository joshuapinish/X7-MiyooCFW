name: Build and test porting core
on:
  push:
    branches: [main, x7-port]
  pull_request:
  workflow_dispatch:
jobs:
  host-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ram_mib: [32, 64, 128, 256]
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build gcc
      - name: Check driver analysis script syntax
        run: bash -n scripts/analyze-arm-driver.sh
      - name: Configure
        run: cmake -S . -B build -G Ninja -DX7_RAM_MIB=${{ matrix.ram_mib }} -DX7_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
